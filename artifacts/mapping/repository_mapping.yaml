# Repository domain mapping for the Defectors dataset (single source of truth).
# Keys MUST match the `repo` column in the parquet files exactly (case-sensitive).
# Repositories under ambiguous_repositories / unmapped_repositories are excluded from all
# ML vs non-ML experiments. openpilot is "borderline": keep it in non_ml, and rerun the
# experiments without it as a sensitivity analysis.

ml_dl_repositories:
  lightning:
    domain: ml_dl
    criteria: "Deep learning framework for PyTorch"
    confidence: clear
  jax:
    domain: ml_dl
    criteria: "Autograd and XLA for ML research"
    confidence: clear
  transformers:
    domain: ml_dl
    criteria: "Hugging Face Transformers - State-of-the-art NLP models"
    confidence: clear
  ray:
