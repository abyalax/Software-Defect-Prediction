[project]
name = "software_defects"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "transformers>=4.30.0,<5.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.11.2",
    "torch",
    "hf-xet>=1.8.0",
]
[project.scripts]
software-defects = "software_defects.cli:main"


[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/software_defects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
